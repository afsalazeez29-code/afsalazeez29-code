name: Update profile dashboard

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Fetch live GitHub dashboard data
        env:
          GH_PROFILE_USER: afsalazeez29-code
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_dashboard.py
      - name: Render dashboard SVGs
        run: python scripts/render_dashboard.py
      - name: Commit refreshed dashboard
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile dashboard [skip ci]"
          file_pattern: "data/dashboard.json languages.svg projects.svg connect.svg"
